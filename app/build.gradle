plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.batteryguard'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.batteryguard"
        minSdk 21          // works on Android 5.0 and newer
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No third-party dependencies on purpose: nothing to download except the build tools.
